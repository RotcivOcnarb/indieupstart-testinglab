AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Indie Feedback - AWS Serverless Architecture for Playtest Platform
  Includes DynamoDB Tables, S3 Buckets, CloudFront, API Gateway HTTP API, and Lambda Functions.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment stage (dev or prod)

  SiteBaseUrl:
    Type: String
    Description: URL base do front-end recebida via samconfig.toml

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        STAGE: !Ref Stage
        USERS_TABLE: !Ref UsersTable
        GAMES_TABLE: !Ref GamesTable
        REVIEWS_TABLE: !Ref ReviewsTable
        WEEKLY_GAME_TABLE: !Ref WeeklyGameTable
        BANNERS_BUCKET: !Ref BannersBucket
        DISCORD_CLIENT_ID: !Sub "{{resolve:secretsmanager:IndieFeedbackDiscord-${Stage}:SecretString:CLIENT_ID}}"
        DISCORD_CLIENT_SECRET: !Sub "{{resolve:secretsmanager:IndieFeedbackDiscord-${Stage}:SecretString:CLIENT_SECRET}}"
        DISCORD_BOT_TOKEN: !Sub "{{resolve:secretsmanager:IndieFeedbackDiscord-${Stage}:SecretString:BOT_TOKEN}}"
        DISCORD_GUILD_ID: !Sub "{{resolve:secretsmanager:IndieFeedbackDiscord-${Stage}:SecretString:GUILD_ID}}"
        DISCORD_FORUM_CHANNEL_ID: !Sub "{{resolve:secretsmanager:IndieFeedbackDiscord-${Stage}:SecretString:FORUM_CHANNEL_ID}}"
        DISCORD_MOD_WEBHOOK_URL: !Sub "{{resolve:secretsmanager:IndieFeedbackDiscord-${Stage}:SecretString:MOD_WEBHOOK_URL}}"
        DISCORD_ANNOUNCEMENTS_CHANNEL_ID: !Sub "{{resolve:secretsmanager:IndieFeedbackDiscord-${Stage}:SecretString:ANNOUNCEMENTS_CHANNEL_ID}}"
        SITE_BASE_URL: !Ref SiteBaseUrl

Resources:
  # =========================================================================
  # DynamoDB Tables
  # =========================================================================
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "IndieFeedback-Users-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  GamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "IndieFeedback-Games-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: threadId
          AttributeType: S
      KeySchema:
        - AttributeName: threadId
          KeyType: HASH

  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "IndieFeedback-Reviews-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: threadId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: threadId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE

  WeeklyGameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "IndieFeedback-WeeklyGame-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: weekId
          AttributeType: S
      KeySchema:
        - AttributeName: weekId
          KeyType: HASH

  # =========================================================================
  # S3 Buckets
  # =========================================================================
  BannersBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "indie-feedback-banners-${Stage}-${AWS::AccountId}-${AWS::Region}"

      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  BannersBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BannersBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${BannersBucket.Arn}/*"

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "indie-feedback-frontend-${Stage}-${AWS::AccountId}-${AWS::Region}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  # =========================================================================
  # CloudFront CDN
  # =========================================================================
  FrontendCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

  # =========================================================================
  # API Gateway (HTTP API v2)
  # =========================================================================
  HttpApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "IndieFeedbackApi-${Stage}"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - x-user-id
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS

  # =========================================================================
  # Lambda Functions
  # =========================================================================
  AuthDiscordFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: auth/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /auth/discord
            Method: POST
            ApiId: !Ref HttpApiGateway

  GetUserProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: user/index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /user/profile
            Method: GET
            ApiId: !Ref HttpApiGateway

  GetGamesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: games/list.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GamesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewsTable
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /games
            Method: GET
            ApiId: !Ref HttpApiGateway

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: games/upload-url.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BannersBucket
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /games/upload-url
            Method: POST
            ApiId: !Ref HttpApiGateway

  CreateGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: games/create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /games
            Method: POST
            ApiId: !Ref HttpApiGateway

  CreateReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: reviews/create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref GamesTable
        - DynamoDBReadPolicy:
            TableName: !Ref WeeklyGameTable
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /reviews
            Method: POST
            ApiId: !Ref HttpApiGateway

  GetReviewHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: reviews/history.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewsTable
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /reviews/history
            Method: GET
            ApiId: !Ref HttpApiGateway

  ReportReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: reports/review.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /reports/review
            Method: POST
            ApiId: !Ref HttpApiGateway

  ReportGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: reports/game.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /reports/game
            Method: POST
            ApiId: !Ref HttpApiGateway

  AdminUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: admin/users.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        GetUsers:
          Type: HttpApi
          Properties:
            Path: /admin/users
            Method: GET
            ApiId: !Ref HttpApiGateway
        UpdateCoins:
          Type: HttpApi
          Properties:
            Path: /admin/users/{id}/coins
            Method: POST
            ApiId: !Ref HttpApiGateway

  AdminGamesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: admin/games.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
      Events:
        CreateGame:
          Type: HttpApi
          Properties:
            Path: /admin/games
            Method: POST
            ApiId: !Ref HttpApiGateway
        DeleteGame:
          Type: HttpApi
          Properties:
            Path: /admin/games/{id}
            Method: DELETE
            ApiId: !Ref HttpApiGateway

  AdminAnnouncementsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: admin/announcements.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        PostAnnouncement:
          Type: HttpApi
          Properties:
            Path: /admin/announcements
            Method: POST
            ApiId: !Ref HttpApiGateway

  # =========================================================================
  # Weekly Game of the Week - Selector Lambda (EventBridge Schedule)
  # Runs every Monday at 17:00 UTC (14:00 BRT)
  # =========================================================================
  WeeklyGameSelectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: weeklyGame/selector.handler
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GamesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeeklyGameTable
      Events:
        WeeklySchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub "IndieFeedback-WeeklyGameSchedule-${Stage}"
            Description: "Selects the Game of the Week every Monday at 14h BRT (17h UTC)"
            ScheduleExpression: "cron(0 17 ? * MON *)"
            ScheduleExpressionTimezone: "UTC"
            State: ENABLED
            RetryPolicy:
              MaximumRetryAttempts: 2

  # =========================================================================
  # Weekly Game - GET Endpoint
  # =========================================================================
  GetWeeklyGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: weeklyGame/get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WeeklyGameTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewsTable
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /weekly-game
            Method: GET
            ApiId: !Ref HttpApiGateway

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway Endpoint URL
    Value: !Sub "https://${HttpApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
  CloudFrontUrl:
    Description: CloudFront Distribution URL for Frontend
    Value: !Sub "https://${FrontendCloudFrontDistribution.DomainName}"
  BannersBucketName:
    Description: S3 Bucket for Uploading Banners
    Value: !Ref BannersBucket
  WeeklyGameTableName:
    Description: DynamoDB Table for Weekly Game of the Week history
    Value: !Ref WeeklyGameTable
