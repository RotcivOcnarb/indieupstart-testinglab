# SAM Configuration File for Indie Feedback Backend Multi-Stage Deployments

version = 0.1

[default]
[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true

# =========================================================================
# DEV STAGE CONFIGURATION
# Usage: sam build && sam deploy --config-env dev
# =========================================================================
[dev]
[dev.deploy.parameters]
profile = "rots-pessoal"
stack_name = "indie-feedback-backend-dev"
s3_prefix = "indie-feedback-backend-dev"
region = "sa-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_NAMED_IAM"
parameter_overrides = 'Stage="dev" SiteBaseUrl="http://indie-feedback-frontend-dev-145908329026-sa-east-1.s3-website-sa-east-1.amazonaws.com"'
resolve_s3 = true

[dev.global.parameters]
region = "sa-east-1"

# =========================================================================
# PROD STAGE CONFIGURATION
# Usage: sam build && sam deploy --config-env prod
# =========================================================================
[prod]
[prod.deploy.parameters]
profile = "rots-pessoal"
stack_name = "indie-feedback-backend-prod"
s3_prefix = "indie-feedback-backend-prod"
region = "sa-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = 'Stage="prod" SiteBaseUrl="http://indie-feedback-frontend-prod-145908329026-sa-east-1.s3-website-sa-east-1.amazonaws.com"'
resolve_s3 = true
disable_rollback = true
image_repositories = []